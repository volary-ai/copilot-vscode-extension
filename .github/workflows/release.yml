name: Release

on:
  push:
    branches: [main]
    paths: ["VERSION"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Read VERSION
        id: ver
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          if [ -z "$v" ]; then
            echo "::error::VERSION is empty"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        run: |
          if git rev-parse "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.ver.outputs.tag }} already exists — bump VERSION to release"
            exit 1
          fi

      - run: npm ci

      - name: Sync package.json to VERSION
        run: npm run sync-version

      - name: Type-check
        run: npm run compile

      - name: Package vsix
        run: npx --yes @vscode/vsce package --out volary.vsix

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath volary.vsix --pat "$VSCE_PAT"

      # Uncomment once an Open VSX token is available (for Cursor/VSCodium users).
      # - name: Publish to Open VSX
      #   env:
      #     OVSX_PAT: ${{ secrets.OVSX_PAT }}
      #   run: npx --yes ovsx publish volary.vsix --pat "$OVSX_PAT"

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: volary.vsix
          generate_release_notes: true
